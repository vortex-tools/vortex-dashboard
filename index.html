<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Icons from vortex-home's set for this site (app, staging or testnet). -->
    <link rel="icon" href="%VITE_FAVICON%" sizes="32x32" />
    <link rel="icon" href="%VITE_FAVICON_SVG%" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%VITE_APPLE_ICON%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="%VITE_THEME_COLOR%" />
    <meta name="description" content="How Solana validators perform under Alpenglow: voting, block production, block income, stake and decentralization." />
    <link rel="manifest" href="%VITE_MANIFEST%" />
    <title>%VITE_APP_TITLE%</title>
    <!-- The Worker puts a plain summary of the page in #root for crawlers
         that don't run JavaScript; with JavaScript the app replaces it, so
         it's hidden until then rather than flashing unstyled. -->
    <script>
      document.documentElement.classList.add('js');
      // Right after a deploy an edge can answer this page with the new
      // build's HTML before it has the build's files: the app's own script
      // fails to load (index.html comes back for it) and nothing would run.
      // Reload a few times, spaced out (as helpers/chunkReload, same key),
      // until the app is up; then its own handlers take over.
      addEventListener(
        'error',
        function (e) {
          var t = e.target;
          var src = t && (t.src || t.href);
          if (window.vxBooted || !src || !/\/assets\//.test(src)) return;
          if (window.vxReloading) return;
          var delays = [0, 3000, 10000];
          var a = { first: Date.now(), count: 0 };
          try {
            var s = JSON.parse(sessionStorage.getItem('vx-chunk-reload'));
            if (s && Date.now() - s.first < 120000) a = s;
          } catch (_) {}
          if (a.count >= delays.length) return;
          try {
            sessionStorage.setItem(
              'vx-chunk-reload',
              JSON.stringify({ first: a.first, count: a.count + 1 })
            );
          } catch (_) {}
          window.vxReloading = true;
          setTimeout(function () {
            location.reload();
          }, delays[a.count]);
        },
        true
      );
    </script>
    <style>
      .js [data-seo-summary] {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
